<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Formal V4 mobile QA</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #354136; }
      body { display: grid; place-items: center; padding: 18px; }
      iframe { width: 390px; height: 844px; border: 0; background: #dceadf; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
    </style>
  </head>
  <body>
    <iframe title="正式界面 4 移动端预览" src="../index.html?v=15"></iframe>
    <script>
      document.querySelector('iframe').addEventListener('load', (event) => {
        const frameDocument = event.currentTarget.contentDocument;
        setTimeout(() => frameDocument.querySelector('#guestButton')?.click(), 280);
      });
    </script>
  </body>
</html>
