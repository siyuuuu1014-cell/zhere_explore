<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Zhere 余映院</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section class="entry" id="entry" aria-labelledby="entry-title">
      <div class="entry-copy">
        <p class="entry-mark">ZHERE</p>
        <h1 id="entry-title">余映院</h1>
        <p class="entry-lead">一座让公共影像长成街景的院子。你可以闲逛，也可以带一束投影回家。</p>
        <form class="entry-form" id="entry-form">
          <label for="player-name">给今天的访客留个名字</label>
          <div class="entry-row">
            <input id="player-name" name="player-name" value="迟野" maxlength="12" autocomplete="off" />
            <button type="submit">进入院子</button>
          </div>
        </form>
        <p class="entry-note">正式版本会在进入前说明行为记录、匿名化与退出研究方式。</p>
      </div>
      <div class="entry-world" aria-hidden="true">
        <div class="entry-sun"></div>
        <div class="entry-wall wall-one"></div>
        <div class="entry-wall wall-two"></div>
        <div class="entry-screen screen-one"><span></span></div>
        <div class="entry-screen screen-two"><span></span></div>
        <div class="entry-person"><i></i></div>
        <p>公共影像留在原地<br />你带走的是它的一次投影</p>
      </div>
    </section>

    <div class="prototype" id="prototype" aria-hidden="true">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand">ZHERE</span>
          <span class="location" id="location-label">公共影像院</span>
        </div>
        <nav class="scene-nav" aria-label="原型场景">
          <button class="scene-button is-active" data-scene="public">公共院</button>
          <button class="scene-button" data-scene="home">我的院子</button>
          <button class="scene-button" data-scene="auction">竞价棚</button>
        </nav>
        <div class="visitor">
          <span id="visitor-name">迟野</span>
          <span class="visitor-figure" aria-hidden="true"></span>
        </div>
      </header>

      <main class="viewport" id="viewport" tabindex="0" aria-label="可移动的影像世界">
        <div class="world" id="world">
          <div class="terrain" aria-hidden="true">
            <div class="yard-patch patch-a"></div>
            <div class="yard-patch patch-b"></div>
            <div class="water-channel"></div>
            <div class="long-wall"></div>
            <div class="tree tree-a"><i></i><i></i><i></i></div>
            <div class="tree tree-b"><i></i><i></i><i></i></div>
            <div class="bench"></div>
            <div class="world-letter letter-a">慢</div>
            <div class="world-letter letter-b">看</div>
          </div>
          <div class="objects" id="objects"></div>
          <div class="player" id="player" aria-label="玩家角色">
            <span class="player-shadow"></span>
            <span class="player-body"></span>
            <span class="player-head"></span>
            <span class="player-carry" id="player-carry"></span>
          </div>
        </div>

        <section class="context" id="context" aria-live="polite">
          <p class="context-name" id="context-name">先随便走走</p>
          <p class="context-action" id="context-action">靠近一块影像，它会先认出你</p>
        </section>

        <section class="viewer" id="viewer" aria-hidden="true" aria-label="影像预览">
          <button class="viewer-close" id="viewer-close" aria-label="关闭预览">关闭</button>
          <div class="viewer-frame">
            <div class="viewer-placeholder" id="viewer-placeholder">
              <span></span><span></span><span></span>
              <p>视频位置保留</p>
            </div>
          </div>
          <div class="viewer-copy">
            <p id="viewer-title">雨后的塑料椅</p>
            <p id="viewer-state">空格键播放</p>
          </div>
        </section>

        <section class="auction-panel" id="auction-panel" aria-hidden="true">
          <p class="auction-kicker">虚拟竞价</p>
          <h2>为这束影像<br />留多少位置</h2>
          <div class="auction-number"><span id="auction-price">18</span><small> 枚</small></div>
          <button id="bid-button">出价 5 枚</button>
          <p id="auction-message">它只决定你愿意放弃多少虚拟预算，不产生购买。</p>
        </section>

        <div class="toast" id="toast" role="status"></div>
      </main>

      <footer class="controls">
        <span><kbd>点击地面</kbd> 或 WASD 移动</span>
        <span><kbd>E</kbd> 看一看</span>
        <span><kbd>F</kbd> 带走或放下</span>
        <span><kbd>空格</kbd> 播放</span>
        <span class="inventory" id="inventory">投影 0</span>
      </footer>
    </div>

    <script src="./prototype.js"></script>
  </body>
</html>
